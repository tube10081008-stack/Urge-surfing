# Render.com 배포 청사진 (Blueprint)
# 대상: 지오(마케팅 오케스트라) 백엔드 — 계정·영속·딥리포트 API
#
# ※ 구 도박 DTx PoC(urge-surfing-api/db)는 블루프린트에서 제외(retire).
#   - 이유: Render 무료 Postgres는 계정당 1개 → geo-marketing-db와 충돌.
#   - PoC DB는 시드 데모 데이터뿐이라 삭제해도 `python manage.py seed`로 재생성 가능.
#   - 다시 배포하려면 git 히스토리의 이전 render.yaml 참조.

services:
  - type: web
    name: geo-marketing-api
    runtime: python
    plan: free
    rootDir: marketing-orchestra/backend
    branch: claude/wonderful-lovelace-54xws3
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://geo-marketing-api.onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://urge-surfing.vercel.app"
      - key: GEMINI_API_KEY
        sync: false               # 대시보드에서 직접 입력(코드/저장소 미포함)
      - key: DATABASE_URL
        fromDatabase:
          name: geo-marketing-db
          property: connectionString

databases:
  - name: geo-marketing-db
    plan: free

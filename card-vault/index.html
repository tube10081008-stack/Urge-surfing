<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드 보관소</title>
<meta name="description" content="중저가 트레이딩 카드를 맡기고, 배송 없이 소유권만 사고파는 카드 보관·거래 MVP">
<style>
:root {
  --bg: #f3f5fa; --card: #fff; --ink: #17202b; --muted: #5f6b7a; --line: #dfe4ec; --chip: #eef1f6;
  --accent: #2f6fd0; --accent-ink: #fff; --good: #2e9e6a; --warn: #d9a400; --bad: #d12f2f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0d1118; --card: #161c26; --ink: #e8edf4; --muted: #95a1b2; --line: #273142; --chip: #1f2735; --accent: #5e9cf0; --accent-ink: #0d1118; }
}
:root[data-theme="dark"] { --bg: #0d1118; --card: #161c26; --ink: #e8edf4; --muted: #95a1b2; --line: #273142; --chip: #1f2735; --accent: #5e9cf0; --accent-ink: #0d1118; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; line-height: 1.5; }
main { max-width: 900px; margin: 0 auto; padding: 14px 16px 96px; overflow-x: clip; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
header h1 { font-size: 1.2rem; margin: 0; flex: 1; white-space: nowrap; }
h2 { font-size: 1.05rem; margin: 0 0 10px; } h3 { font-size: .95rem; margin: 14px 0 6px; }
button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.ghost { background: var(--chip); color: var(--ink); font-weight: 500; }
button.bad { background: var(--bad); color: #fff; } button.good { background: var(--good); color: #fff; } button.warn { background: var(--warn); color: #111; }
button:disabled { opacity: .5; cursor: default; }
button.sm { padding: 6px 10px; font-size: .85rem; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.muted { color: var(--muted); font-size: .86rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.hidden { display: none !important; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 12px; }
.grid > * { min-width: 0; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: left; color: var(--ink); font-weight: 400; position: relative; cursor: pointer; }
.tile.sel { outline: 3px solid var(--accent); }
.tile img { width: 100%; aspect-ratio: 63/88; object-fit: contain; border-radius: 8px; background: var(--chip); display: block; }
.tile .nm { font-weight: 600; font-size: .9rem; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .sub { font-size: .76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .pr { font-weight: 700; margin-top: 2px; }
.gr { position: absolute; top: 12px; left: 12px; color: #fff; font-weight: 900; font-size: .8rem; padding: 1px 8px; border-radius: 7px; }
.g-S { background: linear-gradient(135deg, #7b2cbf, #ff4fd8); } .g-A { background: #2e9e6a; } .g-B { background: #d9a400; } .g-C { background: #d12f2f; }
.st { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.72); color: #fff; font-size: .72rem; padding: 1px 8px; border-radius: 99px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); z-index: 10; }
.tabs button { flex: 1; background: transparent; color: var(--muted); font-weight: 600; padding: 8px 2px; font-size: .82rem; }
.tabs button.on { background: var(--ink); color: var(--bg); }
.pill { display: inline-block; background: var(--chip); border-radius: 99px; padding: 2px 10px; font-size: .8rem; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; } td, th { padding: 7px 5px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; } th { color: var(--muted); font-weight: 500; }
.amt-p { color: var(--good); font-weight: 700; } .amt-m { color: var(--bad); font-weight: 700; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
.modal .card { width: 100%; max-width: 520px; margin: 0; max-height: 90vh; overflow-y: auto; }
@media (min-width: 620px) { .modal { align-items: center; } }
.toast { position: fixed; left: 16px; right: 16px; bottom: 84px; max-width: 520px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; z-index: 40; opacity: 0; transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; } .toast.err { background: var(--bad); color: #fff; }
.item-row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.item-row img { width: 52px; aspect-ratio: 63/88; object-fit: contain; border-radius: 6px; background: var(--chip); }
.seq { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: .75rem; font-weight: 800; margin-right: 6px; }
.res-matched { color: var(--good); } .res-downgraded { color: var(--warn); } .res-mismatch, .res-missing { color: var(--bad); }
.status { padding: 24px; text-align: center; color: var(--muted); }
.bell { position: relative; background: var(--chip); color: var(--ink); padding: 7px 10px; font-size: 1rem; }
.bell b { position: absolute; top: -4px; right: -4px; background: var(--bad); color: #fff; font-size: .68rem; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
.seg { display: flex; gap: 4px; background: var(--chip); border-radius: 10px; padding: 3px; margin-top: 10px; }
.seg button { flex: 1; background: transparent; color: var(--muted); padding: 7px 4px; font-size: .85rem; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--chip); color: var(--ink); }
.tag.auc { background: #ffe7c2; color: #7a4500; } .tag.hot { background: #d6f5e3; color: #11643c; } .tag.warn { background: #ffd9d9; color: #8a1111; }
.tile .meta { font-size: .74rem; color: var(--muted); margin-top: 2px; }
.confirm { border: 2px solid var(--accent); border-radius: 12px; padding: 12px; margin-top: 10px; }
.confirm ul { margin: 6px 0 10px; padding-left: 18px; font-size: .88rem; }
.bar { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; background: var(--good); }
.bar i.hi { background: var(--warn); } .bar i.over { background: var(--bad); }
.stats { font-size: .82rem; color: var(--muted); margin: 6px 0; }
.stats b { color: var(--ink); }
.list-sm { font-size: .85rem; } .list-sm div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.notif { padding: 10px 0; border-bottom: 1px solid var(--line); } .notif.new { background: linear-gradient(90deg, rgba(47,111,208,.10), transparent); }
.notif .t { font-weight: 700; font-size: .92rem; } .notif .b { font-size: .84rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header><h1>🗃️ 카드 보관소</h1><span id="who" class="muted"></span><button id="bell" class="bell hidden" aria-label="알림">🔔<b id="unread" class="hidden"></b></button></header>
  <section id="view"><div class="status">불러오는 중…</div></section>
</main>
<nav class="tabs hidden" id="tabs" role="tablist" aria-label="메뉴">
  <button data-tab="market" role="tab">🛒 마켓</button>
  <button data-tab="vault" role="tab">📦 보관함</button>
  <button data-tab="intake" role="tab">📮 입고</button>
  <button data-tab="wallet" role="tab">💰 지갑</button>
  <button data-tab="admin" role="tab" class="hidden" id="adminTab">🛠 운영</button>
</nav>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
// ================= 기본 =================
const CFG = window.VAULT_CONFIG || {};
const TCG = 'https://api.tcgdex.net/v2/en';
const $ = id => document.getElementById(id);
const view = $('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => n == null ? '—' : (n < 0 ? '-' : '') + '₩' + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const NOIMG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 88"><rect width="63" height="88" rx="4" fill="#e6eaf1"/><text x="31.5" y="46" font-size="7" text-anchor="middle" fill="#8a94a6" font-family="sans-serif">이미지 없음</text></svg>');
const img = (src, alt) => `<img src="${esc(src || NOIMG)}" alt="${esc(alt)}" loading="lazy" onerror="this.onerror=null;this.src='${NOIMG}'">`;
const GRADE_KO = { S: '최상', A: '양호', B: '보통', C: '하자' };
const RESULT_KO = { pending: '검수 대기', matched: '✅ 일치 · 보관함 등록', downgraded: '🟡 등급 하향 등록', mismatch: '❌ 불일치 (반송)', missing: '❌ 누락' };
const BATCH_KO = { draft: '작성 중', shipped: '발송됨 · 도착 대기', received: '검수 중', done: '검수 완료' };
const VAULT_KO = { held: '보관 중', listed: '판매 중', withdraw_requested: '출고 준비', shipped_out: '출고됨' };
function toast(msg, err = false) { const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast.h); toast.h = setTimeout(() => t.className = 'toast', 3200); }
function modal(html) { const m = $('modal'); m.innerHTML = `<div class="card">${html}</div>`; m.classList.remove('hidden'); m.onclick = e => { if (e.target === m) closeModal(); }; return m; }
const closeModal = () => $('modal').classList.add('hidden');
const KIND_TXT = { fixed: '즉시 구매', auction: '경매' };
// 남은 시간 표시 ("3시간 12분", "4분 10초")
function left(ends) {
  const s = Math.max(0, Math.floor((new Date(ends) - Date.now()) / 1000));
  if (!s) return '마감';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}일 ${h}시간` : h ? `${h}시간 ${m}분` : `${m}분 ${s % 60}초`;
}
setInterval(() => document.querySelectorAll('[data-ends]').forEach(e => { e.textContent = left(e.dataset.ends); e.classList.toggle('tag', true); e.classList.toggle('warn', new Date(e.dataset.ends) - Date.now() < 600000); }), 1000);
const sellerLine = s => s ? `거래 <b>${s.sales}</b>건 · 검수 일치 <b>${s.checked ? Math.round(s.matched / s.checked * 100) + '%' : '—'}</b>${s.checked ? ` (${s.matched}/${s.checked})` : ''} · 신뢰 <b>${s.trust}</b>` : '';
const fmtDate = d => new Date(d).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
// 결제 전 확인 패널 (오구매·오입찰 방지): 무엇을, 얼마에, 무엇이 묶이는지, 이번 달 지출이 어떻게 되는지 보여준다
function confirmPanel(box, { title, lines, amount, okLabel, onOk }) {
  const lim = me?.monthly_limit, after = (me?.spent_month || 0) + amount;
  const over = lim != null && after > lim;
  box.innerHTML = `<div class="confirm"><b>${esc(title)}</b><ul>${lines.map(l => `<li>${l}</li>`).join('')}
      <li>쓸 수 있는 포인트 ${won(me?.balance)} → <b>${won((me?.balance || 0) - amount)}</b></li>
      <li>이번 달 지출 ${won(me?.spent_month)} → <b>${won(after)}</b>${lim != null ? ` / 한도 ${won(lim)}` : ''}</li></ul>
      ${over ? '<p class="res-mismatch" style="margin:0 0 8px">⚠️ 이번 달 지출 한도를 넘어서 진행할 수 없어요.</p>' : ''}
      <div class="row"><button class="ghost" data-no>돌아가기</button><button class="grow" data-yes ${over || (me?.balance || 0) < amount ? 'disabled' : ''}>${esc(okLabel)}</button></div></div>`;
  box.querySelector('[data-no]').onclick = () => box.innerHTML = '';
  box.querySelector('[data-yes]').onclick = e => onOk(e.target);
  box.scrollIntoView?.({ block: 'nearest' });
}

// ================= Supabase =================
const ready = CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase;
const sb = ready ? supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
window.sb = sb;
let session = null, me = null;
// 모든 쓰기·읽기는 서버 함수(RPC)로만. 에러 문구는 서버가 한국어로 준다.
async function rpc(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message || '요청에 실패했어요');
  return data;
}
async function act(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); e.shown = true; throw e; }
  finally { if (btn) btn.disabled = false; }
}
async function refreshMe() {
  me = session ? await rpc('me').catch(() => null) : null;
  $('who').textContent = me ? `${me.nickname} · ${won(me.balance)}` : '';
  $('adminTab').classList.toggle('hidden', me?.role !== 'admin');
  $('bell').classList.toggle('hidden', !me);
  $('unread').textContent = me?.unread > 99 ? '99+' : me?.unread || '';
  $('unread').classList.toggle('hidden', !me?.unread);
}

// act()가 이미 토스트로 보여준 에러는 콘솔에 다시 올리지 않음 (이후 동작만 중단)
window.addEventListener('unhandledrejection', e => { if (e.reason?.shown) e.preventDefault(); });

// ================= 알림함 =================
const NOTIF_TAB = { wish: 'market', outbid: 'market', auction_won: 'vault', offer_accepted: 'vault', offer: 'vault', sold: 'wallet', auction_expired: 'vault', offer_closed: 'wallet', intake: 'intake', shipped: 'vault' };
$('bell').onclick = async () => {
  const list = await rpc('my_notifications', { p_limit: 50 }).catch(e => (toast(e.message, true), null));
  if (!list) return;
  modal(`<div class="row"><h2 class="grow" style="margin:0">🔔 알림</h2><button class="ghost sm" id="x">닫기</button></div>
    ${list.length ? list.map(n => `<div class="notif ${n.read ? '' : 'new'}" data-go="${NOTIF_TAB[n.kind] || ''}" style="cursor:pointer"><div class="t">${esc(n.title)}</div>${n.body ? `<div class="b">${esc(n.body)}</div>` : ''}<div class="b">${fmtDate(n.created_at)}</div></div>`).join('')
      : '<div class="status">아직 알림이 없어요. 🛒 마켓에서 카드를 찜하면 올라올 때 알려드려요.</div>'}`);
  $('x').onclick = closeModal;
  $('modal').querySelector('.card').onclick = e => { const n = e.target.closest('[data-go]'); if (n?.dataset.go) { closeModal(); go(n.dataset.go); } };
  if (list.some(n => !n.read)) { await rpc('read_notifications').catch(() => {}); refreshMe(); }
};
// 30초마다 새 알림 확인 (화면이 보일 때만)
setInterval(() => { if (session && !document.hidden) refreshMe(); }, 30000);

// ================= 라우팅 =================
let tab = 'market';
function go(t) { tab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); render(); }
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); };
async function render() {
  window.scrollTo(0, 0);
  if (!ready) return renderSetup();
  $('tabs').classList.remove('hidden');
  if (tab !== 'market' && !session) return renderLogin();
  try {
    if (tab === 'market') return await renderMarket();
    if (tab === 'vault') return await renderVault();
    if (tab === 'intake') return await renderIntake();
    if (tab === 'wallet') return await renderWallet();
    if (tab === 'admin') return await renderAdmin();
  } catch (e) { view.innerHTML = `<div class="status">불러오지 못했어요 😢<br><span class="muted">${esc(e.message)}</span></div>`; }
}

// ================= 설정 안내 =================
function renderSetup() {
  view.innerHTML = `<div class="card"><h2>⚙️ 처음 설정이 필요해요</h2>
    <ol class="muted" style="line-height:1.8;padding-left:18px">
      <li><a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>에서 무료 프로젝트를 만들어요.</li>
      <li>SQL Editor에 <code>supabase/schema.sql</code> 내용을 붙여 넣고 실행해요.</li>
      <li>Authentication → URL Configuration의 Site URL에 이 페이지 주소를 넣어요.</li>
      <li>Project Settings → API의 <b>Project URL</b>과 <b>anon public key</b>를 <code>config.js</code>에 넣어요.</li>
      <li>로그인한 뒤 SQL Editor에서 내 계정을 운영자로:<br><code>update profiles set role='admin' where id=(select id from auth.users where email='내이메일');</code></li>
    </ol></div>`;
}

// ================= 로그인 =================
function renderLogin() {
  view.innerHTML = `<div class="card"><h2>🔐 로그인</h2>
    <p class="muted">이메일로 로그인 링크를 보내드려요. 처음이면 자동으로 가입돼요.</p>
    <form id="lf" class="row"><input id="em" class="grow" type="email" required placeholder="you@example.com" autocomplete="email"><button>링크 받기</button></form>
    <p class="muted" id="lmsg"></p></div>`;
  $('lf').onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter;
    await act(btn, async () => {
      const { error } = await sb.auth.signInWithOtp({ email: $('em').value.trim(), options: { emailRedirectTo: location.href.split('#')[0] } });
      if (error) throw error;
      $('lmsg').textContent = '메일함을 확인해 주세요. 링크를 누르면 여기로 돌아와요.';
    });
  };
}

// ================= 마켓 =================
let mkind = null;
async function renderMarket(q = '') {
  view.innerHTML = `<div class="card"><h2>🛒 마켓</h2>
    <p class="muted" style="margin-top:0">모두 <b>보관소에 입고·검수된 실물</b>이에요. 사면 발송 대기 없이 <b>바로 내 보관함으로</b> 옮겨지고, 모아서 한 번에 받아요.</p>
    <form id="mf" class="row"><input id="mq" class="grow" placeholder="카드·세트 이름 검색" value="${esc(q)}"><button class="ghost">검색</button>${q && session ? '<button type="button" class="ghost" id="wish">🔔 찜</button>' : ''}</form>
    <div class="seg" role="tablist">${[[null, '전체'], ['auction', '⏱ 경매'], ['fixed', '즉시 구매']].map(([k, t]) => `<button type="button" data-k="${k || ''}" class="${mkind === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>
    <div id="mlist"><div class="status">불러오는 중…</div></div>`;
  $('mf').onsubmit = e => { e.preventDefault(); renderMarket($('mq').value.trim()); };
  view.querySelector('.seg').onclick = e => { const b = e.target.closest('[data-k]'); if (b) { mkind = b.dataset.k || null; renderMarket($('mq').value.trim()); } };
  $('wish')?.addEventListener('click', e => act(e.target, () => rpc('add_wish', { p_query: q }), `'${q}' 찜했어요. 새로 올라오면 알려드려요`).catch(() => {}));
  const list = await rpc('market', { p_q: q || null, p_kind: mkind });

function addCardFlow(draft) {
  modal(`<h2>카드 추가</h2><form id="sf" class="row"><input id="sq" class="grow" placeholder="영문 카드 이름 (예: Bulbasaur)" autocomplete="off"><button>찾기</button></form>
    <div id="sres" class="muted" style="margin-top:8px">카드 이름을 영어로 검색해 주세요.</div><div class="row" style="margin-top:10px"><button class="ghost" id="x">닫기</button></div>`);
  $('x').onclick = closeModal;
  $('sf').onsubmit = async e => {
    e.preventDefault();
    const q = $('sq').value.trim(); if (!q) return;
    $('sres').textContent = '찾는 중…';
    try {
      const r = await fetch(`${TCG}/cards?name=${encodeURIComponent(q)}`); if (!r.ok) throw new Error('검색 실패 ' + r.status);
      const list = (await r.json()).filter(c => !/^(A\d|B\d|P-A)/i.test(c.id)).slice(0, 60);
      $('sres').innerHTML = list.length ? `<div class="grid">${list.map(c => `<button type="button" class="tile" data-c="${esc(c.id)}">${img(c.image ? c.image + '/low.webp' : '', c.name)}<div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.id)}</div></button>`).join('')}</div>` : '결과가 없어요.';
      $('sres').onclick = async ev => { const t = ev.target.closest('[data-c]'); if (t) pickGrade(draft, t.dataset.c); };
    } catch (err) { $('sres').textContent = err.message; }
  };
}
async function pickGrade(draft, id) {
  $('sres').innerHTML = '카드 정보 불러오는 중…';
  const c = await (await fetch(`${TCG}/cards/${encodeURIComponent(id)}`)).json();
  const tp = c.pricing?.tcgplayer || {}, usd = ['normal', 'holofoil', 'reverse-holofoil'].map(k => tp[k]?.marketPrice).find(v => v != null);
  const eur = c.pricing?.cardmarket?.trend;
  const krw = usd != null ? Math.round(usd * 1400) : eur != null ? Math.round(eur * 1600) : null;
  const image = c.image ? c.image + '/low.webp' : null;
  $('sres').innerHTML = `<div class="item-row">${img(image, c.name)}<div><b>${esc(c.name)}</b><div class="muted">${esc(c.set?.name || '')} #${esc(c.localId)} · 시세 ${won(krw)}</div></div></div>
    <h3>내가 보는 컨디션</h3><div class="row">${['S', 'A', 'B', 'C'].map(g => `<button type="button" class="ghost grow" data-g="${g}"><span class="gr g-${g}" style="position:static">${g}</span> ${GRADE_KO[g]}</button>`).join('')}</div>
    <p class="muted">입고 검수에서 등급이 달라지면 알려드려요. 스캐너 앱의 📐 등급 측정을 써보면 정확해요.</p>`;
  $('sres').onclick = async e => {
    const b = e.target.closest('[data-g]'); if (!b) return;
    await act(b, () => rpc('add_batch_item', { p_batch: draft.id, p_card_id: c.id, p_name: c.name, p_set: c.set?.name || null, p_number: c.localId, p_image: image, p_market: krw, p_grade: b.dataset.g }), '담았어요');
    closeModal(); renderIntake();
  };
}
function shipFlow(draft) {
  modal(`<h2>📦 발송하기 · ${esc(draft.code)}</h2>
    <ol class="muted" style="line-height:1.8;padding-left:18px">
      <li>카드를 <b>담은 순서대로 1~${draft.items.length}번</b> 슬리브에 넣어요.</li>
      <li>쪽지에 배치 코드 <b>${esc(draft.code)}</b>와 닉네임을 적어 함께 넣어요.</li>
      <li>${esc(CFG.shipTo || '')}</li>
      <li>송장 번호를 적고 발송 완료를 눌러요. 발송 후엔 카드를 더 담을 수 없어요.</li></ol>
    <input id="trk" placeholder="택배사·송장 번호 (예: CJ 1234-5678)">
    <div class="row" style="margin-top:10px"><button class="ghost" id="x">취소</button><button class="grow" id="ok">발송 완료</button></div>`);
  $('x').onclick = closeModal;
  $('ok').onclick = async e => { await act(e.target, () => rpc('submit_batch', { p_batch: draft.id, p_tracking: $('trk').value }), '발송 처리했어요. 도착하면 검수 후 보관함에 등록돼요'); closeModal(); renderIntake(); };
}

// ================= 지갑 =================
async function renderWallet() {
  await refreshMe();
  const [led, actv, wishes] = await Promise.all([rpc('my_ledger'), rpc('my_activity'), rpc('my_wishes')]);
  const KIND = { topup: '충전', purchase: '구매', sale: '판매', fee: '판매 수수료', withdraw_fee: '출고 배송비', cashout: '출금', adjust: '조정' };
  const lim = me.monthly_limit, pct = lim ? Math.min(100, me.spent_month / Math.max(lim, 1) * 100) : 0;
  view.innerHTML = `<div class="card"><h2>💰 지갑</h2><div style="font-size:1.6rem;font-weight:800">${won(me.balance)}</div>
      <div class="muted">쓸 수 있는 포인트${me.held ? ` · 입찰·제안으로 묶인 포인트 <b>${won(me.held)}</b>` : ''}</div>
      <p class="muted">${esc(CFG.depositInfo || '')}</p></div>
    <div class="card"><h2>🧭 이번 달 지출</h2>
      <div class="row"><b class="grow">${won(me.spent_month)}</b><span class="muted">${lim != null ? `한도 ${won(lim)}` : '한도 없음'}</span></div>
      ${lim != null ? `<div class="bar"><i class="${pct >= 100 ? 'over' : pct >= 80 ? 'hi' : ''}" style="width:${pct}%"></i></div>` : ''}
      <p class="muted" style="margin-top:4px">구매 + 지금 묶인 입찰·제안 금액이에요. 한도를 넘는 구매·입찰은 막혀요. <b>낮추기는 바로</b>, 올리기·해제는 <b>24시간 뒤</b> 적용돼요.</p>
      ${me.limit_next_pending ? `<p class="tag hot">예약: ${me.limit_next == null ? '한도 해제' : won(me.limit_next)} · ${fmtDate(me.limit_next_at)} 적용</p>` : ''}
      <div class="row"><input id="lim" class="grow" type="number" inputmode="numeric" min="0" step="10000" placeholder="월 한도 (원)" value="${lim ?? ''}"><button class="ghost" id="limgo">저장</button>${lim != null ? '<button class="ghost" id="limoff">해제</button>' : ''}</div></div>
    ${actv.bids.length || actv.offers.length ? `<div class="card"><h2>⏳ 진행 중</h2>
      ${actv.bids.map(b => `<div class="item-row">${img(b.image, b.name)}<div><b>${esc(b.name)}</b> <span class="tag auc">경매</span> ${b.leading ? '<span class="tag hot">최고 입찰 중</span>' : '<span class="tag warn">밀려남</span>'}
          <div class="muted">현재 ${won(b.top_bid)} · 내 최고 ${won(b.my_max)} · ⏱ <span data-ends="${b.ends_at}">${left(b.ends_at)}</span></div></div></div>`).join('')}
      ${actv.offers.map(o => `<div class="item-row">${img(o.image, o.name)}<div class="row"><div class="grow"><b>${esc(o.name)}</b> <span class="tag">제안</span>
          <div class="muted">${won(o.amount)} 제안 (판매가 ${won(o.price)}) · ${o.status === 'active' ? `${left(o.expires_at)} 뒤 만료` : { accepted: '수락됨', declined: '거절됨', cancelled: '닫힘', expired: '만료됨' }[o.status]}</div></div>
          ${o.status === 'active' ? `<button class="ghost sm" data-co="${o.id}">취소</button>` : ''}</div></div>`).join('')}</div>` : ''}
    <div class="card"><h2>🔔 찜 알림</h2><p class="muted" style="margin-top:0">이 이름이 들어간 카드가 올라오면 알려드려요.</p>
      <form id="wf" class="row"><input id="wq" class="grow" placeholder="예: Pikachu, Umbreon"><button class="ghost">추가</button></form>
      <div class="row" style="margin-top:8px">${wishes.map(w => `<span class="pill">${esc(w.query)} <button class="ghost sm" style="padding:0 4px" data-rw="${w.id}" aria-label="${esc(w.query)} 찜 삭제">✕</button></span>`).join('') || '<span class="muted">아직 없어요</span>'}</div></div>
    <div class="card"><h3 style="margin-top:0">닉네임</h3><div class="row"><input id="nick" class="grow" value="${esc(me.nickname)}" maxlength="20"><button class="ghost" id="nsave">저장</button></div>
      <div class="row" style="margin-top:12px"><button class="ghost" id="out">로그아웃</button></div></div>
    <div class="card"><h2>포인트 내역</h2>${led.length ? `<table>${led.map(l => `<tr><td class="muted">${fmtDate(l.created_at)}</td><td>${KIND[l.kind] || l.kind}${l.memo ? ` <span class="muted">${esc(l.memo)}</span>` : ''}</td><td class="${l.amount > 0 ? 'amt-p' : 'amt-m'}" style="text-align:right">${l.amount > 0 ? '+' : ''}${won(l.amount)}</td></tr>`).join('')}</table>` : '<div class="status">아직 내역이 없어요.</div>'}</div>`;
  const setLim = async (btn, v) => { let r; try { r = await act(btn, () => rpc('set_spend_limit', { p_limit: v })); } catch { return; }
    toast(r.applied ? '한도를 바로 적용했어요' : '24시간 뒤에 적용돼요. 그 전까지는 지금 한도가 유지돼요'); renderWallet(); };
  $('limgo').onclick = e => { const v = $('lim').value.trim(); setLim(e.target, v === '' ? null : +v); };
  $('limoff')?.addEventListener('click', e => setLim(e.target, null));
  view.querySelectorAll('[data-co]').forEach(b => b.onclick = async () => { try { await act(b, () => rpc('cancel_offer', { p_offer: b.dataset.co }), '제안을 취소하고 포인트를 돌려받았어요'); } catch { return; } renderWallet(); });
  $('wf').onsubmit = async e => { e.preventDefault(); try { await act(e.submitter, () => rpc('add_wish', { p_query: $('wq').value }), '찜했어요'); } catch { return; } renderWallet(); };
  view.querySelectorAll('[data-rw]').forEach(b => b.onclick = async () => { await act(b, () => rpc('remove_wish', { p_id: b.dataset.rw })).catch(() => {}); renderWallet(); });
  $('nsave').onclick = async e => { await act(e.target, () => rpc('set_nickname', { p_nickname: $('nick').value }), '저장했어요').catch(() => {}); refreshMe(); };
  $('out').onclick = async () => { await sb.auth.signOut(); };
}

// ================= 운영 =================
async function renderAdmin() {
  if (me?.role !== 'admin') return go('market');
  const [queue, wds] = await Promise.all([rpc('admin_queue'), rpc('admin_withdrawals')]);
  view.innerHTML = `<div class="card"><h2>🛠 입고 검수 <span class="muted">${queue.length}건</span></h2>
      <p class="muted" style="margin-top:0">도착한 배치를 열어 슬리브 순서대로 확인하세요. <b>일치</b>면 신청 등급으로, <b>하향</b>이면 낮춘 등급으로 보관함에 등록돼요. 불일치(바꿔치기 의심)는 신뢰 점수 −10.</p>
      ${queue.length ? queue.map(b => `<details open style="margin-bottom:10px"><summary><b>${esc(b.code)}</b> · ${esc(b.owner_name)} (신뢰 ${b.trust}) · ${esc(b.tracking || '송장 없음')}</summary>
        ${b.items.map(i => `<div class="item-row">${img(i.image, i.name)}<div><span class="seq">${i.seq}</span><b>${esc(i.name)}</b> <span class="muted">${esc(i.set_name || '')} #${esc(i.number || '')} · 신청 ${i.user_grade}</span>
          ${i.status === 'pending' ? `<div class="row" style="margin-top:6px" data-i="${i.id}" data-ug="${i.user_grade}">
            <button class="good sm" data-r="matched">일치</button>
            <select class="sm" style="width:auto" aria-label="하향 등급">${['A', 'B', 'C'].filter(g => 'SABC'.indexOf(g) > 'SABC'.indexOf(i.user_grade)).map(g => `<option>${g}</option>`).join('')}</select><button class="warn sm" data-r="downgraded" ${i.user_grade === 'C' ? 'disabled' : ''}>하향</button>
            <button class="bad sm" data-r="mismatch">불일치</button><button class="ghost sm" data-r="missing">누락</button></div>`
          : `<div class="res-${i.status}" style="font-size:.85rem">${RESULT_KO[i.status]}${i.intake_grade ? ` (${i.intake_grade})` : ''}</div>`}</div></div>`).join('')}</details>`).join('') : '<div class="status">도착 대기 중인 배치가 없어요.</div>'}</div>
    <div class="card"><h2>💰 포인트 충전</h2><p class="muted" style="margin-top:0">입금을 확인한 뒤 충전하세요. 음수면 출금(현금 환급) 처리돼요.</p>
      <div class="row"><input id="tuEmail" class="grow" type="email" placeholder="회원 이메일"><button class="ghost" id="tuFind">찾기</button></div><p id="tuUser" class="muted"></p>
      <div class="row"><input id="tuAmt" class="grow" type="number" step="1000" placeholder="금액 (원)"><input id="tuMemo" class="grow" placeholder="메모 (예: 9/26 입금)"><button id="tuGo" disabled>충전</button></div></div>
    <div class="card"><h2>📤 출고 요청 <span class="muted">${wds.length}건</span></h2>${wds.length ? wds.map(w => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(w.owner_name)}</b> · ${w.cards.length}장 · <span class="${Date.now() - new Date(w.created_at) > 172800000 ? 'res-mismatch' : 'muted'}">요청 ${Math.floor((Date.now() - new Date(w.created_at)) / 3600000)}시간 전</span>
        <div class="muted" style="white-space:pre-wrap">${esc(w.address)}</div><div class="muted">${w.cards.map(c => `${esc(c.name)} (${esc(c.set_name || '')} #${esc(c.number || '')}, ${c.grade})`).join(' · ')}</div>
        <button class="sm" data-ship="${w.id}" style="margin-top:6px">발송 완료</button></div>`).join('') : '<div class="status">출고 요청이 없어요.</div>'}</div>`;
  view.onclick = async e => {
    const r = e.target.closest('[data-r]');
    if (r) {
      const box = r.closest('[data-i]'), res = r.dataset.r;
      const grade = res === 'downgraded' ? box.querySelector('select').value : null;
      const note = res === 'matched' ? null : prompt('메모 (선택)', res === 'downgraded' ? '모서리 까짐' : res === 'mismatch' ? '신청과 다른 카드' : '') ?? null;
      await act(r, () => rpc('admin_check_item', { p_item: box.dataset.i, p_result: res, p_grade: grade, p_note: note }), '처리했어요');
      return renderAdmin();
    }
    const s = e.target.closest('[data-ship]');
    if (s) { await act(s, () => rpc('admin_ship_withdrawal', { p_id: s.dataset.ship }), '발송 처리했어요'); renderAdmin(); }
  };
  let target = null;
  $('tuFind').onclick = async e => {
    target = await act(e.target, () => rpc('admin_find_user', { p_email: $('tuEmail').value }));
    $('tuUser').textContent = target ? `${target.nickname} · 잔액 ${won(target.balance)} · 신뢰 ${target.trust}` : '회원을 찾지 못했어요';
    $('tuGo').disabled = !target;
  };
  $('tuGo').onclick = async e => {
    const amt = +$('tuAmt').value;
    if (!target || !amt || !confirm(`${target.nickname}님에게 ${won(amt)} ${amt > 0 ? '충전' : '출금'}할까요?`)) return;
    const r = await act(e.target, () => rpc('admin_topup', { p_user: target.id, p_amount: amt, p_memo: $('tuMemo').value || null }), '처리했어요');
    $('tuUser').textContent = `${target.nickname} · 잔액 ${won(r.balance)}`;
    if (target.id === me.id) refreshMe();
  };
}

// ================= 시작 =================
(async () => {
  if (!ready) return render();
  session = (await sb.auth.getSession()).data.session;
  sb.auth.onAuthStateChange(async (_e, s) => { session = s; await refreshMe(); render(); });
  await refreshMe();
  go('market');
})();
</script>
</body>
</html>

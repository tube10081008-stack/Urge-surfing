<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포켓몬 카드 팩 도감</title>
<meta name="description" content="포켓몬을 고르면 수록 팩·팩 가격(영문/일본/한국)·수록 카드 시세를 보여주고, 가상으로 팩을 개봉해보는 팬메이드 앱">
<style>
:root {
  --bg: #f3f5fa; --card: #ffffff; --ink: #17202b; --muted: #5f6b7a; --line: #dfe4ec;
  --accent: #e3350d; --accent-ink: #ffffff; --chip: #eef1f6;
  --gold: #d9a400; --ir: #3f8cff; --sir: #c04bff; --hyper: #ffb300;
  /* 개봉·스캔 연출 무대는 테마와 무관하게 어둡게 고정 (의도된 선택) */
  --fx-bg: rgba(5,8,14,.985); --fx-tile: #161c26; --fx-line: #2a3345; --fx-btn: #263043; --fx-muted: #aab;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1118; --card: #161c26; --ink: #e8edf4; --muted: #95a1b2; --line: #273142;
    --accent: #ff5a36; --accent-ink: #0d1118; --chip: #1f2735;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1118; --card: #161c26; --ink: #e8edf4; --muted: #95a1b2; --line: #273142;
  --accent: #ff5a36; --accent-ink: #0d1118; --chip: #1f2735;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; line-height: 1.5; }
main { max-width: 880px; margin: 0 auto; padding: 16px 16px 72px; }
header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
header h1 { font-size: clamp(1.05rem, 4.5vw, 1.3rem); margin: 0; flex: 1; min-width: 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 620px) { .lbl { display: none; } }
h2 { font-size: 1.08rem; margin: 0 0 10px; }
h3 { font-size: .98rem; margin: 14px 0 8px; }
button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.ghost { background: var(--chip); color: var(--ink); font-weight: 500; }
button:disabled { opacity: .5; cursor: default; }
input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
a { color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.muted { color: var(--muted); font-size: .86rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hidden { display: none !important; }
.chip { display: inline-block; background: var(--chip); border-radius: 99px; padding: 2px 9px; font-size: .78rem; margin: 2px 4px 2px 0; }
.tabs { display: flex; gap: 6px; margin: 0 -16px 12px; padding: 8px 16px; position: sticky; top: 0; z-index: 10; background: var(--bg); }
.tabs button { background: var(--chip); color: var(--ink); font-weight: 500; flex: 1; white-space: nowrap; }
.tabs button.on { background: var(--ink); color: var(--bg); }
@media (max-width: 620px) {
  .tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; margin: 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--card); }
  .tabs button { padding: 10px 6px; font-size: .88rem; }
  main { padding-bottom: 88px; } footer { padding-bottom: 90px; }
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile:focus-visible { outline-offset: 0; }
/* 스켈레톤 */
.skel { cursor: default; pointer-events: none; }
.skel i, .skel b { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--chip) 25%, var(--line) 50%, var(--chip) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; }
.skel i { aspect-ratio: 63/88; } .skel b { height: 12px; margin-top: 8px; } .skel b + b { width: 60%; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
/* 시세 칩 */
.pchips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.pchip { flex: 0 0 auto; min-width: 140px; scroll-snap-align: start; background: var(--chip); border-radius: 12px; padding: 8px 12px; }
.pchip .v { font-size: 1.15rem; font-weight: 700; display: block; }
.src { font-size: .7rem; padding: 1px 7px; border-radius: 99px; font-weight: 700; }
.src.auto { background: #2e9e6a22; color: #2e9e6a; } .src.mine { background: #3f8cff22; color: #3f8cff; } .src.none { background: var(--line); color: var(--muted); }
details.mine summary { cursor: pointer; color: var(--muted); font-size: .86rem; margin-top: 8px; }
.sortbar { display: flex; gap: 6px; margin: 0 0 10px; }
.sortbar button { padding: 6px 12px; font-size: .85rem; background: var(--chip); color: var(--ink); font-weight: 500; }
.sortbar button.on { background: var(--ink); color: var(--bg); }

/* search */
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.suggest button { padding: 6px 10px; font-size: .88rem; }

/* card grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 12px; }
.grid > * { min-width: 0; }
main { overflow-x: clip; }
.logo { max-height: 64px; max-width: 100%; object-fit: contain; }
.tile img.logo { width: auto; max-width: 100%; height: 64px; aspect-ratio: auto; background: none; margin: 0 auto; }
.logoPh { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; max-width: 200px; padding: 6px 12px; border-radius: 10px; background: var(--chip); color: var(--ink); font-weight: 800; font-size: .9rem; text-align: center; line-height: 1.2; }
.packart .logoPh { background: rgba(255,255,255,.9); color: #1b1b1b; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; cursor: pointer; text-align: left; color: var(--ink); font-weight: 400; position: relative; }
.tile:hover { border-color: var(--accent); }
.tile:active { transform: scale(.98); }
.tile .pbadge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.78); color: #fff; font-size: .8rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; opacity: 0; transition: opacity .15s; }
@media (hover: hover) { .tile:hover .pbadge { opacity: 1; } }
.tile img, .cimg { width: 100%; aspect-ratio: 63/88; object-fit: contain; border-radius: 8px; background: var(--chip); display: block; }
.tile .nm { font-weight: 600; font-size: .9rem; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .pr { font-size: .85rem; }
.rank { position: absolute; top: 4px; left: 4px; background: var(--ink); color: var(--bg); border-radius: 99px; font-size: .75rem; padding: 1px 8px; font-weight: 700; }

/* detail */
.detail { display: grid; grid-template-columns: 240px 1fr; gap: 18px; }
.detail > * { min-width: 0; }
td { overflow-wrap: anywhere; }
@media (max-width: 620px) { .detail { grid-template-columns: 1fr; } .detail .cimg { max-width: 260px; margin: 0 auto; } }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
td, th { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
.big { font-size: 1.25rem; font-weight: 700; }
.priceIn { width: 110px; padding: 5px 8px; font-size: .85rem; }

/* pack */
.packhead { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.packhead img { height: 56px; max-width: 200px; object-fit: contain; }
.packhead { min-width: 0; } .packhead > div { min-width: 0; overflow-wrap: anywhere; }
.odds td:last-child, .odds th:last-child { text-align: right; }

/* opening */
#stage { position: fixed; inset: 0; background: var(--fx-bg); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; color: #fff; overflow-y: auto; }
#stage > :first-child { margin-top: auto; } #stage > :last-child { margin-bottom: auto; }
.packart { width: 200px; height: 300px; border-radius: 14px; background: linear-gradient(135deg, #e3350d, #7a1a8f 55%, #1d3fbf); display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: pointer; position: relative; overflow: hidden; }
.packart img { max-width: 160px; max-height: 80px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.packart::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); animation: sheen 2.2s infinite; }
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.packart.shake { animation: shake .5s; }
.packart.tear { animation: tear .6s forwards; }
@keyframes shake { 20%,60% { transform: rotate(-4deg); } 40%,80% { transform: rotate(4deg); } }
@keyframes tear { to { transform: translateY(-40px) scale(1.1); opacity: 0; } }
.reveal { width: min(300px, 74vw); aspect-ratio: 63/88; position: relative; perspective: 900px; cursor: pointer; touch-action: none; }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; overflow: hidden; }
.face.back { background: radial-gradient(circle at 50% 50%, #fff 0 12%, #222 12% 16%, transparent 16%), linear-gradient(#e3350d 0 47%, #222 47% 53%, #f4f4f4 53%); border: 6px solid #2a4fb8; }
.face.front { transform: rotateY(180deg); background: #222; }
.face.front img { width: 100%; height: 100%; object-fit: contain; }
.glow-ultra .under, .glow-ultra .face.front { box-shadow: 0 0 30px 6px var(--gold); }
.glow-ir .under, .glow-ir .face.front { box-shadow: 0 0 34px 8px var(--ir); }
.glow-sir .under, .glow-sir .face.front { box-shadow: 0 0 44px 12px var(--sir); animation: pulse 1.2s infinite; }
.glow-hyper .under, .glow-hyper .face.front { box-shadow: 0 0 50px 14px var(--hyper); animation: pulse .9s infinite; }
@keyframes pulse { 50% { filter: brightness(1.25); } }
.revealInfo { text-align: center; margin-top: 14px; min-height: 4.5em; }
.revealInfo .rar { font-size: 1.1rem; font-weight: 700; }
.hitbanner { font-size: 1.6rem; font-weight: 800; letter-spacing: .02em; animation: pop .5s; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.counter { color: #aab; font-size: .85rem; margin-bottom: 10px; }
.summary { width: 100%; max-width: 820px; }
.summary .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.summary .tile .nm { font-size: .8rem; }
.summary .tile { background: var(--fx-tile); color: #fff; border-color: var(--fx-line); cursor: default; }
.summary .tile.best { border: 2px solid var(--hyper); box-shadow: 0 0 20px var(--hyper); }
.stageBtns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
.stageBtns .ghost { background: var(--fx-btn); color: #fff; }
@media (prefers-reduced-motion: reduce) { .packart::after, .glow-sir .under, .glow-hyper .under { animation: none; } }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal .card { max-width: 420px; width: 100%; margin: 0; }
.status { padding: 20px; text-align: center; color: var(--muted); }
footer { max-width: 880px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: .76rem; }
footer a { color: var(--muted); }

/* ===== 스캐너 ===== */
.scanbox { position: relative; width: 100%; max-width: 440px; margin: 0 auto; aspect-ratio: 3/4; background: #000; border-radius: 18px; overflow: hidden; touch-action: none; }
.scanbox video, .scanbox .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.guide { position: absolute; left: 50%; top: 47%; height: 78%; aspect-ratio: 63/88; transform: translate(-50%, -50%); border-radius: 4.6% / 3.3%; box-shadow: 0 0 0 9999px rgba(0,0,0,.58); transition: box-shadow .3s; }
.guide.lock { box-shadow: 0 0 0 9999px rgba(0,0,0,.75), 0 0 24px 4px #37e39a inset; }
.guide b { position: absolute; width: 16%; height: 11.5%; border: 4px solid rgba(255,255,255,.9); transition: border-color .2s; }
.guide b:nth-child(1) { left: -3px; top: -3px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
.guide b:nth-child(2) { right: -3px; top: -3px; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
.guide b:nth-child(3) { left: -3px; bottom: -3px; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
.guide b:nth-child(4) { right: -3px; bottom: -3px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
.guide.t b:nth-child(1), .guide.t b:nth-child(2) { border-top-color: #37e39a; }
.guide.bm b:nth-child(3), .guide.bm b:nth-child(4) { border-bottom-color: #37e39a; }
.guide.l b:nth-child(1), .guide.l b:nth-child(3) { border-left-color: #37e39a; }
.guide.r b:nth-child(2), .guide.r b:nth-child(4) { border-right-color: #37e39a; }
.hold { position: absolute; left: 10%; right: 10%; bottom: -16px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.2); overflow: hidden; }
.hold i { display: block; height: 100%; width: 0; background: #37e39a; transition: width .12s; }
.scanMsg { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #fff; font-weight: 700; text-shadow: 0 1px 4px #000; font-size: .98rem; padding: 0 12px; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.laser { position: absolute; left: 6%; right: 6%; height: 3px; top: 10%; background: linear-gradient(90deg, transparent, #38f6ff, transparent); box-shadow: 0 0 14px 3px #38f6ff; animation: laser 1.1s ease-in-out infinite alternate; }
@keyframes laser { to { top: 88%; } }
.scanBtns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.shutter { width: 64px; height: 64px; border-radius: 50%; border: 5px solid var(--ink); background: var(--accent); padding: 0; }

/* ===== 이벤트 모달 (쪼기) ===== */
#event { position: fixed; inset: 0; z-index: 40; overflow-y: auto; color: #fff; background: radial-gradient(circle at 50% 30%, #2a2f55 0%, #07080f 70%); display: flex; flex-direction: column; align-items: center; padding: 18px 16px 40px; }
#event > * { flex: none; }
#event .evTop { margin-top: auto; }
#event .evEnd { margin-bottom: auto; }
.evCard { width: min(250px, 62vw); aspect-ratio: 63/88; border-radius: 14px; position: relative; animation: evIn .9s cubic-bezier(.2,1.4,.4,1); }
.evCard img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
@keyframes evIn { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }
.evCard.g-ultra { box-shadow: 0 0 40px 8px var(--gold); }
.evCard.g-ir { box-shadow: 0 0 44px 10px var(--ir); }
.evCard.g-sir { box-shadow: 0 0 60px 16px var(--sir); animation: evIn .9s cubic-bezier(.2,1.4,.4,1), pulse 1.1s infinite .9s; }
.evCard.g-hyper { box-shadow: 0 0 70px 20px var(--hyper); animation: evIn .9s cubic-bezier(.2,1.4,.4,1), pulse .8s infinite .9s; }
.rays { position: absolute; inset: -60%; z-index: -1; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.10) 0 8deg, transparent 8deg 20deg); animation: spin 14s linear infinite; border-radius: 50%; mask: radial-gradient(circle, #000 20%, transparent 65%); -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); }
@keyframes spin { to { transform: rotate(360deg); } }
.evBanner { margin: 16px 0 4px; font-size: 1.4rem; font-weight: 900; letter-spacing: .04em; text-align: center; animation: pop .5s; min-height: 1.6em; }
.evName { color: #c9cde0; text-align: center; font-size: .95rem; }
.slip { position: relative; width: min(340px, 88vw); height: 150px; margin-top: 18px; perspective: 650px; }
.slip .under { position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(#fffdf5, #f1e6c4); color: #1a1405; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 0 0 3px #c9a64a; }
.slip .plabel { font-size: .8rem; color: #7a6326; font-weight: 700; letter-spacing: .2em; }
.slip .pval { font-size: clamp(2.2rem, 11vw, 3.2rem); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.slip .psub { font-size: .8rem; color: #7a6326; }
.cover { position: absolute; inset: 0; border-radius: 16px; transform-origin: 50% 0%; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(circle at 50% 50%, #fff 0 9%, #1b1b1b 9% 12.5%, transparent 12.5%), linear-gradient(#e3350d 0 47%, #1b1b1b 47% 53%, #f4f4f4 53%);
  box-shadow: 0 0 0 5px #2a4fb8, 0 12px 30px rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
.cover::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(to top, rgba(0,0,0,var(--shade, 0)), transparent 70%); pointer-events: none; }
.cover[data-from="top"]::after { background: linear-gradient(to bottom, rgba(0,0,0,var(--shade, 0)), transparent 70%); }
.cover.cardback { border-radius: 14px; box-shadow: inset 0 0 0 6px #2a4fb8, 0 12px 30px rgba(0,0,0,.6); background: radial-gradient(circle at 50% 50%, #fff 0 12%, #222 12% 16%, transparent 16%), linear-gradient(#e3350d 0 47%, #222 47% 53%, #f4f4f4 53%); align-items: center; }
.cover.cardback .hint { position: absolute; bottom: 14px; }
.reveal .under { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: #222; }
.reveal .under img { width: 100%; height: 100%; object-fit: contain; }
.cover .hint { margin-bottom: 8px; font-size: .82rem; font-weight: 700; color: #1b1b1b; background: rgba(255,255,255,.85); padding: 3px 10px; border-radius: 99px; animation: nudge 1.4s infinite; }
@keyframes nudge { 50% { transform: translateY(-5px); } }
.cover.gone { transition: transform .5s cubic-bezier(.3,.1,.3,1), opacity .5s; transform: rotateX(-110deg) translateY(-60px) !important; opacity: 0; pointer-events: none; }
.cover.gone[data-from="top"] { transform: rotateX(110deg) translateY(60px) !important; }
/* 걷어 올리기 */
.cover.back, .flap.back { transition: clip-path .32s cubic-bezier(.3,1.4,.5,1), top .32s cubic-bezier(.3,1.4,.5,1), height .32s, opacity .32s; }
.cover.peeled { transition: clip-path .4s ease-in; }
.flap { position: absolute; left: 0; right: 0; height: 0; opacity: 0; pointer-events: none; border-radius: 14px 14px 4px 4px; z-index: 2;
  background: linear-gradient(to top, #f7f7f7, #d9dde3 45%, #aeb4bd); box-shadow: 0 -10px 18px rgba(0,0,0,.45); }
.flap[data-from="top"] { border-radius: 4px 4px 14px 14px; background: linear-gradient(to bottom, #f7f7f7, #d9dde3 45%, #aeb4bd); box-shadow: 0 10px 18px rgba(0,0,0,.45); }
.flap.peeled { transition: opacity .3s; }
.slip .flap { border-radius: 16px 16px 4px 4px; }
.cover.back { transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
.evVerdict { margin-top: 16px; font-size: 1.7rem; font-weight: 900; text-align: center; min-height: 1.3em; }
.evInfo { width: min(420px, 92vw); margin-top: 12px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 12px 14px; font-size: .88rem; }
.evInfo a { color: #9fc3ff; }
.evInfo td, .evInfo th { border-color: rgba(255,255,255,.12); color: #e6e9f5; }
.evBtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.evBtns .ghost { background: var(--fx-btn); color: #fff; }
.shake { animation: shake .45s; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { .rays, .laser, .cover .hint, .skel i, .skel b, .evCard, .hitbanner, .evBanner { animation: none !important; } .tile:active { transform: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="homeLink">🃏 포켓몬 카드 팩 도감</h1>
    <button class="ghost" id="binderBtn" aria-label="내 바인더">📒<span class="lbl"> 내 바인더</span></button>
    <button class="ghost" id="settingsBtn" aria-label="설정">⚙️</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="메뉴">
    <button data-tab="search" class="on" role="tab" aria-selected="true" aria-controls="view">🔎 포켓몬</button>
    <button data-tab="sets" role="tab" aria-selected="false" aria-controls="view">📦 팩</button>
    <button data-tab="scan" role="tab" aria-selected="false" aria-controls="view">📷 스캔</button>
  </nav>

  <section id="view" role="tabpanel" aria-live="polite"></section>

const API = 'https://api.tcgdex.net/v2/en';

const DEF = { theme: 'auto', usdKrw: 1400, eurKrw: 1600, jpyKrw: 9.5, region: 'kr' };
function loadStore() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } }
let store = Object.assign({ settings: { ...DEF }, binder: {}, opened: 0, spentIfReal: 0, myPrices: {}, collection: {}, sound: true }, loadStore());
store.settings = Object.assign({ ...DEF }, store.settings);
function save() { try { localStorage.setItem(LS, JSON.stringify(store)); } catch {} }

// ================= 이름 사전 =================
const norm = s => (s || '').toLowerCase().replace(/[’`]/g, "'").replace(/[^a-z0-9éè♀♂' -]/g, ' ').replace(/\s+/g, ' ').trim();
const byEn = new Map(), byKo = new Map(), byJa = new Map();
for (const [id, en, ko, ja] of NAMES) {
  const r = { id, en, ko, ja };
  byEn.set(norm(en), r); if (ko) byKo.set(ko, r); if (ja) byJa.set(ja, r);
}
function findSpecies(q) {
  q = q.trim(); if (!q) return null;
  return byKo.get(q) || byJa.get(q) || byEn.get(norm(q)) || null;
}
function suggestSpecies(q, n = 8) {
  q = q.trim(); if (!q) return [];
  const lq = q.toLowerCase(), out = [];
  for (const [id, en, ko, ja] of NAMES) {
    if (ko.includes(q) || ja.includes(q) || en.toLowerCase().includes(lq)) out.push({ id, en, ko, ja });
    if (out.length >= n) break;
  }
  return out;
}
// "Charizard ex", "Mega Charizard X ex", "Team Rocket's Mewtwo ex" → 종 찾기 (긴 이름 우선)
function speciesOfCard(cardName) {
  const w = norm(cardName).split(' ');
  for (let len = 3; len >= 1; len--)
    for (let i = 0; i + len <= w.length; i++) {
      const hit = byEn.get(w.slice(i, i + len).join(' '));
      if (hit) return hit;
    }
  return null;
}

function tierOf(r) {
  r = (r || '').toLowerCase();
  if (!r) return 'common';
  if (r.includes('promo')) return 'promo';
  if (r.includes('special illustration')) return 'sir';
  if (r.includes('illustration')) return 'ir';
  if (/hyper|secret|rainbow|gold|crown/.test(r)) return 'hyper';
  if (r.includes('ace spec')) return 'ace';
  if (r.includes('double')) return 'double';

  if (r === 'uncommon') return 'uncommon';

  return 'rare';
}

function priceOf(c) {
  let usd = null, variant = '';
  const tp = c.tcgplayer && c.tcgplayer.prices;
  if (tp) for (const [k, v] of Object.entries(tp)) {
    const m = v.market ?? v.mid;
    if (m != null && (usd == null || m > usd)) { usd = m; variant = k; }
  }
  const cm = c.cardmarket && c.cardmarket.prices;
  const eur = cm ? (cm.trendPrice ?? cm.averageSellPrice ?? null) : null;
  const krw = usd != null ? usd * S().usdKrw : eur != null ? eur * S().eurKrw : null;
  return { usd, eur, krw, variant };
}
const won = n => n == null ? '—' : '₩' + Math.round(n).toLocaleString('ko-KR');

// ================= API (TCGdex) =================
// 목록 API는 요약(id·번호·이름·이미지)만 주므로, 레어도·시세는 카드별 상세를 따로 불러온다.
// 안정성: 요청마다 12초 제한 + 최대 3번 재시도, 받은 결과는 폰에 12시간 저장(두 번째부터 즉시).
const sleep = ms => new Promise(r => setTimeout(r, ms));
class NotFound extends Error {}
async function getJSON(url) {
  for (let attempt = 0; ; attempt++) {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (r.status === 404) throw new NotFound('없는 카드예요');
      if (!r.ok) throw new Error('서버 응답 ' + r.status);
      return await r.json();
    } catch (e) {
      if (e instanceof NotFound || attempt >= 2) throw e.name === 'AbortError' ? new Error('응답이 너무 느려요') : e;
      await sleep(700 * (attempt + 1));
    } finally { clearTimeout(tm); }
  }
}
// 영구 캐시 (localStorage, 12시간). 용량이 차면 오래된 것부터 절반 비운다.
const PC = 'pkc1:', PC_TTL = 12 * 3600e3;
function pcGet(k) { try { const v = JSON.parse(localStorage.getItem(PC + k)); if (v && Date.now() - v.t < PC_TTL) return v.d; } catch {} return null; }
function pcPrune() {
  try {
    const ks = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(PC)) { let t = 0; try { t = JSON.parse(localStorage.getItem(k)).t; } catch {} ks.push([k, t]); } }
    ks.sort((a, b) => a[1] - b[1]).slice(0, Math.ceil(ks.length / 2)).forEach(([k]) => localStorage.removeItem(k));
  } catch {}
}
function pcPut(k, d) { const v = JSON.stringify({ t: Date.now(), d }); try { localStorage.setItem(PC + k, v); } catch { pcPrune(); try { localStorage.setItem(PC + k, v); } catch {} } }

const cache = new Map();
function api(path, params = {}, persist = false) {
  const qs = new URLSearchParams(params).toString();
  const key = path + (qs ? '?' + qs : '');
  if (cache.has(key)) return cache.get(key);
  const hit = persist && pcGet(key);
  const p = hit ? Promise.resolve(hit) : getJSON(API + key).then(d => { if (persist) pcPut(key, d); return d; });
  cache.set(key, p);
  p.catch(() => cache.delete(key));
  return p;
}
// TCGdex에는 모바일 게임 'TCG 포켓' 카드도 섞여 있다 (세트 A1, A2a, B1, P-A …) → 제외
const isPocket = id => /^(A\d|B\d|P-A)/i.test(id || '');
const imgUrl = (base, q) => base ? `${base}/${q}.webp` : '';
function normSet(s) {
  return { id: s.id, name: s.name, series: s.serie?.name || '', releaseDate: s.releaseDate || '',
    printedTotal: s.cardCount?.official ?? '', total: s.cardCount?.total ?? '', images: { logo: s.logo ? s.logo + '.png' : '' } };
}
function normCard(c) {
  const tp = c.pricing?.tcgplayer, cm = c.pricing?.cardmarket, prices = {};
  if (tp) for (const [k, v] of Object.entries(tp)) if (v && typeof v === 'object') prices[k] = { market: v.marketPrice ?? null, mid: v.midPrice ?? null };
  return {
    id: c.id, name: c.name, rarity: c.rarity && c.rarity !== 'None' ? c.rarity : '', number: c.localId,
    set: normSet(c.set || {}), images: { small: imgUrl(c.image, 'low'), large: imgUrl(c.image, 'high') },
    tcgplayer: tp ? { prices } : null,
    cardmarket: cm ? { prices: { trendPrice: cm.trend ?? null, averageSellPrice: cm.avg ?? null } } : null

}
// 요약 → 화면용 임시 카드 (시세는 상세가 오면 채움)
function briefCard(b, set) {
  return { id: b.id, name: b.name, number: b.localId, rarity: '', brief: true, set: set || { name: '' },
    images: { small: imgUrl(b.image, 'low'), large: imgUrl(b.image, 'high') }, tcgplayer: null, cardmarket: null };
}
const full = new Map();
function fetchCard(id) {
  if (!full.has(id)) {
    const hit = pcGet('c:' + id);
    const p = hit ? Promise.resolve(hit) : getJSON(API + '/cards/' + encodeURIComponent(id)).then(normCard).then(c => { pcPut('c:' + id, c); return c; });
    full.set(id, p); p.catch(() => full.delete(id));

}
// 동시 10개씩. onCard(카드|null, 완료수, 전체) · alive()가 false면 중단(화면을 떠난 경우)
async function fullCards(briefs, onCard, alive = () => true) {
  const out = new Array(briefs.length); let i = 0, done = 0;
  const worker = async () => {
    while (i < briefs.length && alive()) {
      const k = i++;
      out[k] = await fetchCard(briefs[k].id).catch(() => null);
      onCard && alive() && onCard(out[k], ++done, briefs.length, briefs[k]);
    }
  };
  await Promise.all(Array.from({ length: Math.min(10, briefs.length) }, worker));
  return out.filter(Boolean);
}

  const re = new RegExp(`(^|[^a-z])${norm(sp.en).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^a-z]|$)`);
  return briefs.filter(c => !isPocket(c.id) && re.test(norm(c.name)));
}

const avg = arr => arr && arr.length ? arr.reduce((s, c) => s + (priceOf(c).krw || 0), 0) / arr.length : 0;
function expectedValue(tiers) {
  const base = (tiers.common ? 4 * avg(tiers.common) : 0) + (tiers.uncommon ? 3 * avg(tiers.uncommon) : 0) + avg([...(tiers.common || []), ...(tiers.uncommon || []), ...(tiers.rare || [])]) * 2;
  let hits = 0, rareShare = 1;
  for (const t of ['double', 'ultra']) if (tiers[t]) { hits += TIERS[t].rate * avg(tiers[t]); rareShare -= TIERS[t].rate; }
  for (const t of ['ir', 'sir', 'hyper', 'special', 'ace']) if (tiers[t]) { hits += TIERS[t].rate * avg(tiers[t]); }
  return base + hits + rareShare * avg(tiers.rare || tiers.uncommon);
}

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function rollSlot(tiers, table, fallback) {
  let r = Math.random();
  for (const t of table) if (tiers[t]) { if (r < TIERS[t].rate) return pick(tiers[t]); r -= TIERS[t].rate; }
  return pick(fallback);
}
function buildPack(tiers) {
  const commons = tiers.common || tiers.uncommon || tiers.rare;
  const uncommons = tiers.uncommon || commons;
  const pool = [...(tiers.common || []), ...(tiers.uncommon || []), ...(tiers.rare || [])];
  const rares = tiers.rare || uncommons;
  const pack = [];
  for (let i = 0; i < 4; i++) pack.push(pick(commons));
  for (let i = 0; i < 3; i++) pack.push(pick(uncommons));
  pack.push(rollSlot(tiers, ['ace', 'special'], pool));          // 리버스 1
  pack.push(rollSlot(tiers, ['hyper', 'sir', 'ir'], pool));      // 리버스 2 / 일러스트 슬롯
  pack.push(rollSlot(tiers, ['ultra', 'double'], rares));        // 레어 슬롯 (맨 뒤)
  return pack;
}
function openPack(set, tiers, packKr) {
  const pack = buildPack(tiers);
  store.opened++; store.spentIfReal += packKr || 0;
  for (const c of pack) {
    const b = store.binder[c.id] || { n: 0, name: c.name, img: c.images.small, set: c.set.name, rarity: c.rarity };
    b.n++; b.krw = priceOf(c).krw; store.binder[c.id] = b;
  }
  save();
  const stage = document.getElementById('stage');
  stage.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  // 쪼는 동안 아래 카드가 바로 보이도록 10장 이미지를 미리 받아둔다
  for (const c of pack) for (const u of [c.images.small, c.images.large]) if (u) { const im = new Image(); im.src = u; }
  if (store.quick) return showSummary();
  stage.innerHTML = `<div class="counter">${esc(set.name)} · 0 / ${pack.length}</div>
    <div class="packart" id="packArt">${logoTag(set)}<div style="margin-top:14px;font-weight:700">탭해서 뜯기</div></div>
    <div class="stageBtns"><button class="ghost" id="skipAll">결과 바로 보기</button></div>`;
  const art = document.getElementById('packArt');
  art.onclick = () => {
    art.classList.add('shake');
    setTimeout(() => { art.classList.remove('shake'); art.classList.add('tear'); }, 500);
    setTimeout(() => showCard(0), 1050);
  };
  document.getElementById('skipAll').onclick = () => showSummary();

  function showCard(i) {
    if (i >= pack.length) return showSummary();
    const c = pack[i], t = tierOf(c.rarity), g = TIERS[t].glow, p = priceOf(c);
    stage.innerHTML = `<div class="counter" aria-live="polite">${i + 1} / ${pack.length}</div>
      <div class="reveal" id="rv">
        <div class="under"><img id="uimg" src="${esc(c.images.small || NOIMG)}" alt="${esc(c.name)}" onerror="this.onerror=null;this.src='${NOIMG}'"></div>
        <div class="cover cardback" id="cv"><span class="hint">⬆⬇ 위·아래를 잡고 살짝 들어보기 · 탭하면 바로</span></div>
      </div>
      <div class="revealInfo" id="ri"><span class="muted">위나 아래 끝을 잡고 조금씩 들어 올려보세요</span></div>
      <div class="stageBtns"><button class="ghost" id="skipAll">결과 바로 보기</button></div>`;
    document.getElementById('skipAll').onclick = () => showSummary();
    const rv = document.getElementById('rv');
    if (c.images.large) { const hi = new Image(); hi.onload = () => { const u = document.getElementById('uimg'); if (u) u.src = hi.src; }; hi.src = c.images.large; }
    makeSqueeze(document.getElementById('cv'), {
      onTap: open => open(),
      onOpen: () => {
        if (g) { rv.classList.add('glow-' + g); buzz(g === 'hyper' || g === 'sir' ? [80, 50, 80, 50, 160] : [60]); }
        const hit = g ? `<div class="hitbanner" style="color:var(--${g === 'ultra' ? 'gold' : g})">${{ ultra: '✨ 울트라 레어!', ir: '🎨 일러스트 레어!', sir: '💜 스페셜 일러스트 레어!!', hyper: '👑 하이퍼 레어!!!' }[g]}</div>` : '';
        document.getElementById('ri').innerHTML = `${hit}<div class="rar">${esc(c.name)}</div><div>${esc(c.rarity || '')} · <b>${won(p.krw)}</b></div><div class="muted">탭해서 다음 카드</div>`;
        setTimeout(() => { rv.onclick = () => showCard(i + 1); }, 350);   // 여는 동작의 클릭이 바로 넘기지 않게
      }
    });
  }
  function showSummary() {
    const total = pack.reduce((s, c) => s + (priceOf(c).krw || 0), 0);
    const best = pack.reduce((a, c) => (priceOf(c).krw || 0) > (priceOf(a).krw || 0) ? c : a, pack[0]);
    stage.innerHTML = `<div class="summary">
      <h2 style="text-align:center;margin-bottom:4px">개봉 결과</h2>
      <p style="text-align:center;margin-top:0">카드 가치 합계 <b>${won(total)}</b> <span style="color:#aab">· 팩 ${won(packKr)}</span><br>
        👑 최고가: <b>${esc(best.name)}</b> ${won(priceOf(best).krw)}</p>
      <div class="grid">${pack.map(c => `<div class="tile ${c === best ? 'best' : ''}">${imgTag(c.images.small, c.name)}<div class="nm">${esc(c.name)}</div><div class="pr">${won(priceOf(c).krw)}</div></div>`).join('')}</div>
      <p style="text-align:center;color:#aab;font-size:.85rem">지금까지 가상 개봉 ${store.opened}팩 · 실제로 샀다면 ${won(store.spentIfReal)} · 실제 지출 ₩0</p>
      <div class="stageBtns"><button id="again">🎁 한 팩 더</button><button class="ghost" id="close">팩 정보로</button><button class="ghost" id="toBinder">📒 바인더</button></div></div>`;
    const close = () => { stage.classList.add('hidden'); document.body.style.overflow = ''; };
    document.getElementById('close').onclick = close;
    document.getElementById('toBinder').onclick = () => { close(); go('binder'); };
    document.getElementById('again').onclick = () => { close(); confirmOpen(set, tiers, packKr); };
  }
}

// 가이드(화면 좌표) → 비디오 픽셀 좌표 (object-fit: cover 보정)
function guideInVideo(vid) {
  const box = document.getElementById('sbox').getBoundingClientRect(), g = document.getElementById('guide').getBoundingClientRect();
  const s = Math.max(box.width / vid.videoWidth, box.height / vid.videoHeight);
  const ox = (box.width - vid.videoWidth * s) / 2, oy = (box.height - vid.videoHeight * s) / 2;
  return { x: (g.left - box.left - ox) / s, y: (g.top - box.top - oy) / s, w: g.width / s, h: g.height / s };
}

// 가이드 주변 띠에서 카드 테두리(가장 강한 직선 경계)를 찾는다
function toGray(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114;
  return g;
}
function findEdges(g, w, h, gd, bandFrac) {
  const at = (x, y) => g[y * w + x];
  const bh = Math.max(2, Math.round(gd.h * bandFrac)), bw = Math.max(2, Math.round(gd.w * bandFrac));
  const clampY = y => Math.min(h - 2, Math.max(1, y)), clampX = x => Math.min(w - 2, Math.max(1, x));
  const rowScore = y => { let s = 0, n = 0; for (let x = clampX(gd.x + gd.w * .15 | 0); x < clampX(gd.x + gd.w * .85 | 0); x++, n++) s += Math.abs(at(x, y + 1) - at(x, y - 1)); return n ? s / n : 0; };
  const colScore = x => { let s = 0, n = 0; for (let y = clampY(gd.y + gd.h * .15 | 0); y < clampY(gd.y + gd.h * .85 | 0); y++, n++) s += Math.abs(at(x + 1, y) - at(x - 1, y)); return n ? s / n : 0; };
  const best = (from, to, fn, clamp) => { let b = { pos: from, score: 0 }; for (let v = clamp(from); v <= clamp(to); v++) { const sc = fn(v); if (sc > b.score) b = { pos: v, score: sc }; } return b; };
  return {
    top: best(Math.round(gd.y - bh), Math.round(gd.y + bh), rowScore, clampY),
    bottom: best(Math.round(gd.y + gd.h - bh), Math.round(gd.y + gd.h + bh), rowScore, clampY),
    left: best(Math.round(gd.x - bw), Math.round(gd.x + bw), colScore, clampX),
    right: best(Math.round(gd.x + gd.w - bw), Math.round(gd.x + gd.w + bw), colScore, clampX)
  };
}
const EDGE_TH = 22;

function watch(vid) {
  const W = 180, small = document.createElement('canvas'), sctx = small.getContext('2d', { willReadFrequently: true });
  let prev = null, steady = 0, last = 0;
  const guide = document.getElementById('guide'), bar = document.getElementById('holdBar'), msg = document.getElementById('smsg');
  const step = t => {
    scanLoop = requestAnimationFrame(step);
    if (t - last < 110 || !vid.videoWidth) return; last = t;
    const gv = guideInVideo(vid);
    const m = .14, rx = gv.x - gv.w * m, ry = gv.y - gv.h * m, rw = gv.w * (1 + 2 * m), rh = gv.h * (1 + 2 * m);
    const k = W / rw, H = Math.round(rh * k);
    small.width = W; small.height = H;
    sctx.drawImage(vid, rx, ry, rw, rh, 0, 0, W, H);
    const g = toGray(sctx, W, H);
    const gd = { x: gv.w * m * k, y: gv.h * m * k, w: gv.w * k, h: gv.h * k };
    const e = findEdges(g, W, H, gd, .09);
    const ok = { t: e.top.score > EDGE_TH, bm: e.bottom.score > EDGE_TH, l: e.left.score > EDGE_TH, r: e.right.score > EDGE_TH };
    for (const c in ok) guide.classList.toggle(c, ok[c]);
    let diff = 0;
    if (prev) { for (let i = 0; i < g.length; i += 3) diff += Math.abs(g[i] - prev[i]); diff /= g.length / 3; }
    prev = g;
    const sides = Object.values(ok).filter(Boolean).length;
    if (sides === 4 && diff < 7) steady++; else steady = Math.max(0, steady - 2);
    bar.style.width = Math.min(100, steady / 7 * 100) + '%';
    msg.textContent = sides < 4 ? (sides >= 2 ? '조금만 더 맞춰주세요' : '카드를 틀에 맞춰주세요') : diff >= 7 ? '흔들리지 않게 잡아주세요' : '좋아요, 그대로…';
    if (steady >= 7) {
      const rect = { x: rx + e.left.pos / k, y: ry + e.top.pos / k, w: (e.right.pos - e.left.pos) / k, h: (e.bottom.pos - e.top.pos) / k };
      capture(rect);
    }
  };
  scanLoop = requestAnimationFrame(step);
}

function capture(rect) {
  const vid = document.getElementById('vid');
  if (!vid || !vid.videoWidth) return;
  cancelAnimationFrame(scanLoop); scanLoop = 0;
  if (!rect) rect = guideInVideo(vid);
  const card = document.createElement('canvas'); card.width = CARD_W; card.height = CARD_H;
  card.getContext('2d').drawImage(vid, rect.x, rect.y, rect.w, rect.h, 0, 0, CARD_W, CARD_H);
  document.getElementById('flash').classList.add('go');
  document.getElementById('guide').classList.add('lock');
  sfx.shutter(); buzz(40);
  stopCamera();
  analyze(card);
}

// 사진 파일: 가운데 카드 비율 틀을 기준으로 넓은 띠에서 테두리 탐색
async function fromFile(file) {
  stopCamera();
  const img = await createImageBitmap(file);
  const W = 260, k = W / img.width, H = Math.round(img.height * k);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, W, H);
  let gh = H * .8, gw = gh * CARD_W / CARD_H;
  if (gw > W * .8) { gw = W * .8; gh = gw * CARD_H / CARD_W; }
  const gd = { x: (W - gw) / 2, y: (H - gh) / 2, w: gw, h: gh };
  const e = findEdges(toGray(ctx, W, H), W, H, gd, .24);
  const good = [e.top, e.bottom, e.left, e.right].every(s => s.score > EDGE_TH * .8) && e.right.pos - e.left.pos > W * .25;
  const r = good ? { x: e.left.pos, y: e.top.pos, w: e.right.pos - e.left.pos, h: e.bottom.pos - e.top.pos } : { x: 0, y: 0, w: W, h: H };
  const card = document.createElement('canvas'); card.width = CARD_W; card.height = CARD_H;
  card.getContext('2d').drawImage(img, r.x / k, r.y / k, r.w / k, r.h / k, 0, 0, CARD_W, CARD_H);
  analyze(card);
}

// ---------- OCR (Tesseract.js, 처음 한 번만 내려받음) ----------
let ocrP = null;
function loadOcr() {
  return ocrP ??= new Promise((ok, no) => {
    if (window.Tesseract) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = ok; s.onerror = () => { ocrP = null; no(new Error('OCR 엔진을 불러오지 못했어요')); };
    document.head.append(s);
  }).then(() => Tesseract.createWorker('eng', 1, {
    workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    langPath: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int'
  })).then(async w => { await w.setParameters({ tessedit_pageseg_mode: '11' }); return w; })
    .catch(e => { ocrP = null; throw e; });
}
function strip(card, y0, y1, x0 = 0, x1 = 1) {
  const sw = (x1 - x0) * CARD_W, sh = (y1 - y0) * CARD_H, sc = 1400 / sw;
  const c = document.createElement('canvas'); c.width = 1400; c.height = Math.round(sh * sc);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.filter = 'grayscale(1) contrast(1.6)';
  ctx.drawImage(card, x0 * CARD_W, y0 * CARD_H, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function parseNumber(text) {
  const t = text.replace(/[|\\]/g, '/');
  const m = t.match(/\b([A-Z]{2})?([0-9OoIlS]{1,3})\s*\/\s*([A-Z]{2})?([0-9OoIlS]{2,3})\b/);
  if (!m) return null;
  const fix = s => s.replace(/[Oo]/g, '0').replace(/[Il]/g, '1').replace(/S/g, '5');
  const num = m[1] ? m[1] + fix(m[2]) : String(+fix(m[2]));
  return { num, total: +fix(m[4]), raw: m[0] };
}
async function readCard(card) {
  const w = await loadOcr();
  const top = (await w.recognize(strip(card, .015, .13, .03, .97))).data.text;
  const bot = (await w.recognize(strip(card, .86, .985))).data.text;
  let sp = speciesOfCard(top), no = parseNumber(bot);
  if (!sp || !no) {                                   // 부족하면 카드 전체를 한 번 더
    const all = (await w.recognize(strip(card, 0, 1))).data.text;
    sp = sp || speciesOfCard(all); no = no || parseNumber(all);
  }
  return { sp, no, text: (top + ' ' + bot).replace(/\s+/g, ' ').trim() };
}

async function lookup({ sp, no }) {
  let list = [];
  if (no) {
    // 인쇄된 총 장수(165 등)가 같은 세트들에서 "세트ID-번호" 카드를 직접 조회
    const sets = no.total ? (await api('/sets')).filter(x => !isPocket(x.id) && x.cardCount?.official === no.total).slice(-15) : [];
    const ids = [...new Set(sets.flatMap(x => [`${x.id}-${no.num}`, `${x.id}-${no.num.padStart(3, '0')}`]))];
    list = (await Promise.all(ids.map(id => fetchCard(id).catch(() => null)))).filter(Boolean).reverse();
    if (sp) { const hit = list.filter(c => speciesOfCard(c.name)?.id === sp.id); if (hit.length) list = hit; }
  }
  if (!list.length && sp) {
    const same = c => !no || String(c.localId).replace(/^0+/, '') === no.num.replace(/^0+/, '');
    list = await cardsOfSpecies(sp, same);
    if (!list.length && no) list = await cardsOfSpecies(sp);
  }
  return remember(list);
}

async function analyze(card) {
  const box = document.getElementById('sbox'), out = document.getElementById('scanOut');
  if (!box) return;
  box.querySelector('video')?.remove();
  const shot = card; shot.className = 'shot'; shot.style.objectFit = 'contain';
  box.prepend(shot);
  document.getElementById('guide').classList.add('hidden');
  box.insertAdjacentHTML('beforeend', '<div class="laser"></div>');
  document.getElementById('smsg').textContent = '카드 판독 중…';
  let info;
  try { info = await readCard(card); } catch (e) { info = { sp: null, no: null, text: '', err: e.message }; }
  let list = [];
  try { if (info.sp || info.no) list = await lookup(info); } catch (e) { info.err = e.message; }
  box.querySelector('.laser')?.remove();
  document.getElementById('smsg').textContent = list.length ? '찾았어요!' : '카드를 알아보지 못했어요';
  const again = `<button class="ghost" onclick="renderScan()">↻ 다시 스캔</button>`;
  const read = `<p class="muted">읽은 정보: ${info.sp ? esc(info.sp.ko) + ' (' + esc(info.sp.en) + ')' : '이름 ?'} · ${info.no ? esc(info.no.raw) : '번호 ?'}${info.err ? ' · ' + esc(info.err) : ''}</p>`;
  if (!list.length) {
    out.innerHTML = `<div class="card">${read}<p>번호(카드 왼쪽 아래 “199/165” 같은 숫자)가 잘 보이게, 빛 반사 없이 다시 찍어보세요.</p>
      <div class="row">${again}${info.sp ? `<button data-sp="${esc(info.sp.ko)}">${esc(info.sp.ko)} 카드 목록에서 고르기</button>` : ''}</div></div>`;
    return;
  }
  if (list.length === 1) return reveal(list[0], card);
  out.innerHTML = `<div class="card">${read}<h2>어떤 카드인가요?</h2><div class="grid" id="cands">${list.slice(0, 24).map(c => tileHtml(c).replace('data-card=', 'data-pick=')).join('')}</div><div class="row" style="margin-top:10px">${again}</div></div>`;
  document.getElementById('cands').onclick = e => { const t = e.target.closest('[data-pick]'); if (t) { e.stopPropagation(); reveal(cardIndex.get(t.dataset.pick), card); } };
}

// ---------- 효과음·진동 ----------
let actx = null;
function tone(freq, dur, type = 'sine', vol = .15, when = 0) {
  if (!store.sound) return;
  try {
    actx ??= new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  shutter() { tone(1800, .05, 'square', .08); tone(900, .08, 'square', .06, .05); },
  beat(p) { tone(70 + p * 60, .12, 'sine', .35); tone(55 + p * 50, .1, 'sine', .25, .13); },
  tick(p) { tone(300 + p * 900, .04, 'triangle', .08); },
  drum() { for (let i = 0; i < 14; i++) tone(90 + i * 6, .06, 'triangle', .12, i * (0.11 - i * .005)); },
  win(level) {
    const notes = [[523, 659], [523, 659, 784], [523, 659, 784, 1047], [523, 659, 784, 1047, 1319, 1568]][level];
    notes.forEach((f, i) => tone(f, .35 + level * .1, 'triangle', .14, i * .09));
    if (level === 3) [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .6, 'sine', .1, .6 + i * .12));
  }
};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

// ---------- 컨페티 ----------
function confetti(n, palette) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 4, s: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: palette[Math.floor(Math.random() * palette.length)] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < 3500) requestAnimationFrame(f); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

// ---------- 이벤트 모달: 가격 쪼기 ----------
const VERDICT = [
  { max: 5000, text: '무난한 한 장', color: '#c9cde0', level: 0 },
  { max: 30000, text: '오, 괜찮은데요?', color: '#7fe0b0', level: 1 },
  { max: 100000, text: '✨ 대박!', color: '#ffd24a', level: 2 },
  { max: Infinity, text: '👑 잭팟!!', color: '#ff9bf0', level: 3 }
];
function reveal(c, shot) {
  const p = priceOf(c), t = tierOf(c.rarity), gl = TIERS[t].glow, sp = speciesOfCard(c.name);
  const ev = document.getElementById('event');
  document.body.style.overflow = 'hidden';
  ev.classList.remove('hidden');
  ev.innerHTML = `<div class="evTop"></div>
    <div class="evCard ${gl ? 'g-' + gl : ''}" id="evCard">${gl ? '<div class="rays"></div>' : ''}<img alt="${esc(c.name)}"></div>
    <div class="evBanner" id="evBanner"></div>
    <div class="evName">${esc(c.name)}${sp ? ' · ' + esc(sp.ko) : ''} — ${esc(c.set.name)} #${esc(c.number)}</div>
    <div class="slip" id="slip">
      <div class="under"><div class="plabel">MARKET PRICE</div><div class="pval" id="pval">${p.krw != null ? won(p.krw) : '시세 없음'}</div><div class="psub" id="psub" style="visibility:hidden">${p.usd != null ? usd(p.usd) + ' · TCGplayer' : p.eur != null ? eur(p.eur) + ' · Cardmarket' : ''}</div></div>
      <div class="cover" id="cover"><span class="hint">⬆⬇ 위나 아래를 잡고 천천히 들어 쪼아보세요</span></div>
    </div>
    <div class="evVerdict" id="evVerdict"></div>
    <div id="evMore" class="evEnd"></div>`;
  const img = ev.querySelector('#evCard img');
  img.src = shot ? shot.toDataURL('image/jpeg', .85) : c.images.small;
  const hi = new Image(); hi.onload = () => { img.src = hi.src; }; hi.src = c.images.large || c.images.small;
  sfx.drum(); buzz([30, 60, 30, 60, 30]);
  setTimeout(() => {
    const b = document.getElementById('evBanner');
    if (b) { b.textContent = `${TIERS[t].ko} (${TIERS[t].ab})`; b.style.color = gl ? `var(--${gl === 'ultra' ? 'gold' : gl})` : '#e6e9f5'; }
    if (gl) buzz(gl === 'hyper' || gl === 'sir' ? [80, 50, 80, 50, 160] : [60]);
  }, 1300);
  squeeze(c, p);
}

// 쪼기: 덮개의 아래쪽을 잡으면 위로, 위쪽을 잡으면 아래로 걷어 올린다.
// 끈 거리만큼 정확히 아래(실제 카드·가격)가 드러나고, 접힌 자리엔 말린 종이(flap)와 그림자가 생긴다.
// openAt 넘게 걷고 놓으면 완전히 열리고, 덜 걷으면 다시 내려앉는다. onTap이 있으면 탭으로 바로 열기.
function makeSqueeze(cover, { openAt = .72, dist, onOpen, onTap } = {}) {
  const flap = document.createElement('div');
  flap.className = 'flap';
  cover.after(flap);
  let y0 = null, from = 'bottom', prog = 0, lastStep = 0, done = false, moved = false;
  const H = () => cover.offsetHeight;
  const set = v => {
    prog = v;
    const h = H(), d = v * h, f = Math.min(d * .5, h * .22);   // 드러난 높이, 말린 종이 높이
    cover.dataset.from = from;
    cover.style.clipPath = from === 'bottom' ? `inset(0 0 ${d}px 0 round 14px)` : `inset(${d}px 0 0 0 round 14px)`;
    flap.dataset.from = from;
    flap.style.height = f + 'px';
    flap.style.top = (from === 'bottom' ? h - d - f : d) + 'px';
    flap.style.opacity = d > 2 ? 1 : 0;
    const stepN = Math.floor(v * 12);
    if (stepN !== lastStep) { lastStep = stepN; sfx.tick(v); buzz(8 + stepN * 2); if (stepN && stepN % 3 === 0) sfx.beat(v); }
  };
  const open = () => {
    if (done) return; done = true;
    cover.classList.remove('back'); flap.classList.remove('back');
    cover.classList.add('peeled'); flap.classList.add('peeled');
    cover.style.clipPath = from === 'bottom' ? 'inset(0 0 100% 0 round 14px)' : 'inset(100% 0 0 0 round 14px)';
    flap.style.opacity = 0;
    setTimeout(() => { cover.style.visibility = 'hidden'; }, 420);
    onOpen && onOpen();
  };
  cover.onpointerdown = e => {
    if (done) return;
    const r = cover.getBoundingClientRect();
    from = e.clientY - r.top > r.height / 2 ? 'bottom' : 'top';
    y0 = e.clientY; moved = false;
    cover.classList.remove('back'); flap.classList.remove('back');
    cover.setPointerCapture(e.pointerId);
  };
  cover.onpointermove = e => {
    if (y0 == null || done) return;
    const raw = e.clientY - y0;
    if (Math.abs(raw) > 6 && !moved) { moved = true; cover.querySelector('.hint')?.remove(); }
    const d = Math.max(0, from === 'bottom' ? -raw : raw);
    set(Math.min(1, Math.pow(d / (dist || H() * .9), 1.2)));   // 처음엔 뻑뻑하게
  };
  const release = () => {
    if (y0 == null || done) return; y0 = null;
    if (!moved && onTap) return onTap(open);
    if (prog >= openAt) open();
    else { cover.classList.add('back'); flap.classList.add('back'); set(0); }
  };
  cover.onpointerup = release; cover.onpointercancel = release;
  return { open };
}
function squeeze(c, p) {
  const cover = document.getElementById('cover');
  const finish = () => {
    const v = VERDICT.find(x => (p.krw ?? 0) < x.max);
    countUp(document.getElementById('pval'), p.krw);
    setTimeout(() => document.getElementById('psub').style.visibility = '', 900);
    setTimeout(() => {
      const vd = document.getElementById('evVerdict');
      vd.textContent = p.krw == null ? '시세 정보가 없어요' : v.text; vd.style.color = v.color;
      if (p.krw != null) {
        sfx.win(v.level); buzz([[60], [80, 40, 80], [120, 50, 120, 50, 200], [200, 60, 200, 60, 200, 60, 400]][v.level]);
        confetti([20, 70, 160, 320][v.level], v.level === 3 ? ['#ff5a5a', '#ffd24a', '#5affa1', '#5ab8ff', '#c05aff', '#fff'] : ['#ffd24a', '#fff3b0', '#e3b341', '#fff']);
        if (v.level >= 2) document.getElementById('slip').classList.add('shake');
      }
      showEvMore(c, p);
    }, 750);
  };
  makeSqueeze(cover, { dist: 260, onOpen: finish });   // 가격 덮개는 낮아서 더 길게 끌어야 열리게
}
function countUp(el, target) {
  if (target == null) return;
  const t0 = performance.now(), D = 900;
  (function f(t) { const k = Math.min(1, (t - t0) / D); el.textContent = won(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
}
function showEvMore(c, p) {
  const sp = speciesOfCard(c.name), ab = TIERS[tierOf(c.rarity)].ab;
  const krQ = encodeURIComponent(`${sp ? sp.ko : c.name} ${ab} 포켓몬카드`), jpQ = encodeURIComponent(`${sp ? sp.ja : c.name} ${ab}`);
  const have = store.collection[c.id];
  document.getElementById('evMore').innerHTML = `<div class="evInfo"><table>
      <tr><th>🇺🇸 영문판</th><td>TCGplayer ${usd(p.usd)} · Cardmarket ${eur(p.eur)}</td></tr>
      <tr><th>🇯🇵 일본판</th><td><a href="https://snkrdunk.com/search?keywords=${jpQ}" target="_blank" rel="noopener">스니덩</a> · <a href="https://www.cardrush-pokemon.jp/product-list?keyword=${jpQ}" target="_blank" rel="noopener">카드러시</a></td></tr>
      <tr><th>🇰🇷 한국판</th><td><a href="https://m.bunjang.co.kr/search/products?q=${krQ}" target="_blank" rel="noopener">번개장터</a> · <a href="https://kream.co.kr/search?keyword=${krQ}" target="_blank" rel="noopener">KREAM</a></td></tr>
    </table></div>
    <div class="evBtns">
      <button id="evKeep">${have ? `📒 한 장 더 추가 (보유 ${have.n})` : '📒 내 컬렉션에 추가'}</button>
      <button class="ghost" id="evDetail">카드 상세</button>
      <button class="ghost" id="evAgain">📷 다음 카드</button>
    </div>`;
  const close = () => { document.getElementById('event').classList.add('hidden'); document.body.style.overflow = ''; };
  document.getElementById('evKeep').onclick = e => {
    const x = store.collection[c.id] || { n: 0, name: c.name, img: c.images.small, set: c.set.name };
    x.n++; x.krw = p.krw; x.date = new Date().toLocaleDateString('ko-KR');
    store.collection[c.id] = x; save();
    e.target.textContent = `✔ 추가했어요 (보유 ${x.n})`; e.target.disabled = true;
  };
  document.getElementById('evDetail').onclick = () => { close(); go('card', c.id); };
  document.getElementById('evAgain').onclick = () => { close(); renderScan(); };
}

route();
</script>

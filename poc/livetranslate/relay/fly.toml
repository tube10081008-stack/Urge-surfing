# Fly.io 배포 설정 — Live Translate 릴레이.
#
# 사용 전 app 이름을 전세계에서 유일한 값으로 바꾸세요(예: livetranslate-relay-홍길동).
# 배포는 도쿄(nrt) 리전. Fly가 https/wss + TLS를 자동 제공합니다.
#   → 앱에는 wss://<app>.fly.dev 를 입력.

app = "CHANGE-ME-unique-name"
primary_region = "nrt"   # 도쿄. 싱가포르는 sin, 서울은 없음(가까운 nrt 권장)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true          # http → https 강제(앱은 wss 사용)
  auto_stop_machines = false   # 정지 안 함(콜드스타트로 인한 레이턴시 제거)
  auto_start_machines = true
  min_machines_running = 1     # 항상 1대 가동(비용 소폭↑, 응답 즉시)

[env]
  PORT = "8080"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

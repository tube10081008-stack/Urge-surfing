name: livetranslate_poc
description: Gemini 3.5 Live Translate 실시간 음성 통역 PoC (릴레이 경유)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # 릴레이와의 WebSocket(오디오 양방향).
  web_socket_channel: ^3.0.0
  # 마이크 PCM16 스트림 캡처 + 원시 PCM 재생(녹음/재생 통합).
  flutter_sound: ^9.10.4
  # 마이크 권한.
  permission_handler: ^11.3.0
  # 릴레이 주소/토큰/언어 설정 저장.
  shared_preferences: ^2.2.0
  # 문구/OCR REST 호출.
  http: ^1.2.1
  # 카메라 OCR용 이미지 촬영/선택.
  image_picker: ^1.1.0
  # 오프라인 문구 음성 캐시 저장 위치.
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

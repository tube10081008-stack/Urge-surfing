name: Build Live Translate APK

# 수동 실행 + 작업 브랜치 push 시 Live Translate PoC 앱(APK) 빌드.
# 앱에 android/ 플랫폼 폴더가 없으므로 setup.sh가 `flutter create`로 생성하고
# 마이크/인터넷 권한과 minSdk를 보정한다.
on:
  workflow_dispatch:
    inputs:
      relay_base_url:
        description: "릴레이 WebSocket 주소 (--dart-define RELAY_BASE_URL)"
        required: false
        default: "wss://my-relay.example.com"
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "poc/livetranslate/app/**"
      - ".github/workflows/build-livetranslate-apk.yml"

env:
  FLUTTER_VERSION: "3.24.0"
  APP_DIR: poc/livetranslate/app

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 플랫폼 폴더 생성 + 권한/minSdk 보정
        working-directory: ${{ env.APP_DIR }}
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: 정적 분석
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: APK 빌드 (release, 기본 debug 서명)
        working-directory: ${{ env.APP_DIR }}
        env:
          # 릴레이 토큰은 저장소 시크릿에서 주입(없으면 빈 값).
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          RELAY_URL="${{ github.event.inputs.relay_base_url }}"
          RELAY_URL="${RELAY_URL:-wss://my-relay.example.com}"
          echo "Building APK with RELAY_BASE_URL=$RELAY_URL"
          flutter build apk --release \
            --dart-define=RELAY_BASE_URL="$RELAY_URL" \
            --dart-define=RELAY_TOKEN="${RELAY_TOKEN:-}"

      - name: APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: livetranslate-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
